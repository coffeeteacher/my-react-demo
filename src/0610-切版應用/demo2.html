<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .wrap {
            width: 100%;
        }

        .item {
            width: 300px;
            position: relative;
        }

        .item img {
            width: 100%;
            vertical-align: bottom;
        }

        .item .txt {
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, .6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 20px;
            opacity: 0;
            transition: opacity .5s;
        }

        .item:hover .txt {
            opacity: 1;
        }

        .item h2 {
            color: #ff0;
        }

        .item h2::after {
            content: '';
            display: block;
            width: 0%;
            height: 2px;
            background-color: #ff0;
            margin-top: 10px;
            margin-bottom: 10px;
            transition: width .5s .3s;
        }

        .item:hover h2:after {
            width: 95%;
        }

        .item p {
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="item">
            <img src="./images/pic1.jpg" alt="">
            <div class="txt">
                <h2>互動圖文卡片</h2>
                <p>Lorem ipsum dolor sit amet.</p>
            </div>
        </div>
    </div>
</body>

</html>
