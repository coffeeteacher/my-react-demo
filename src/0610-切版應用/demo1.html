<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .banner {
            background-color: #ccc;

            /* 滿版設定 */
            width: 100%;
            height: 100vh;
            background:
                linear-gradient(115deg, #7bf 50%, transparent 50%),
                url("./images/pic1.jpg") right center;
        }

        .container {
            width: 1200px;
            height: 100%;
            margin: auto;
        }

        .banner-txt {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .banner-txt h1 {
            font-size: 80px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .banner-txt small {
            display: block;
            font-size: 50px;
        }

        .banner-txt h2 {
            font-size: 50px;
        }

        .banner-txt p {
            font-size: 26px;
        }
    </style>
</head>

<body>
    <div class="banner">
        <div class="container">
            <div class="banner-txt">
                <h1>主標題
                    <small>
                        主標題內容主標題內容
                    </small>
                </h1>
                <h2>副標題</h2>
                <p>副標題內容副標題內容副標題內容</p>
            </div>
        </div>
    </div>
</body>

</html>
